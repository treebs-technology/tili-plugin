interface:
  display_name: 'Campaign Workflow'
  short_description: 'Run a campaign step by step: plan, ads, images, setup, results'
  default_prompt: 'Run the campaign workflow for this workspace.'
policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: mcp
      value: tili
      description: tili MCP gateway (Brand OS + Meta campaign tools)
      transport: streamable_http
      url: https://backend.tili.global/mcp
